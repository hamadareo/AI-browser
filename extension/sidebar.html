<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Local AI Browser</title>
  <link rel="stylesheet" href="sidebar.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="header">
    <div class="logo-container">
      <div class="logo">🤖</div>
      <span class="title">Local AI Browser</span>
    </div>
  </div>
  
  <div class="chat-container" id="chat-container">
    <div class="message system-message">
      <p>こんにちは！どのようなタスクをお手伝いしましょうか？ (例: 「このページを要約して」「Twitterで検索して」)</p>
    </div>
  </div>
  
  <div class="input-area">
    <textarea id="task-input" placeholder="How can I help you today?" rows="1"></textarea>
    <button id="send-button" title="Send">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>
  
  <script src="sidebar.js"></script>
</body>
</html>
